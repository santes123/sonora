; Configuración común de PHP (desarrollo y producción)
expose_php = Off
date.timezone = UTC
default_charset = "UTF-8"

; Subidas grandes (FLAC, WAV). Nginx debe permitir el mismo tamaño.
upload_max_filesize = 256M
post_max_size = 260M
memory_limit = 512M
max_execution_time = 600
max_input_time = 600
max_file_uploads = 20

; Opcache: en producción se desactiva validate_timestamps vía override.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Errores al log de PHP-FPM (los logs de aplicación van a storage/logs).
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
