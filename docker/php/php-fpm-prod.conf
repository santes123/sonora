; Pool de PHP-FPM para producción.
; Sustituye al www.conf por defecto de la imagen oficial.
;
; Los valores se ajustan por variable de entorno (ver docker-compose.prod.yml)
; para poder recalibrar el servidor sin reconstruir la imagen:
;   PHP_FPM_MAX_CHILDREN, PHP_FPM_START_SERVERS, PHP_FPM_MIN_SPARE_SERVERS,
;   PHP_FPM_MAX_SPARE_SERVERS, PHP_FPM_MAX_REQUESTS
;
; Referencia de cálculo (servidor de 4 vCPU / 8 GB):
;   max_children = min(20, (RAM en MB * 0.75) / memoria_límite_por_worker)
;   memoria_límite_por_worker ≈ 128 MB (PHP-FPM ~40 MB + picos de la app)

[www]
user = www-data
group = www-data

listen = 9000
listen.backlog = 511

pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = ${PHP_FPM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${PHP_FPM_MAX_SPARE_SERVERS}
pm.max_requests = ${PHP_FPM_MAX_REQUESTS}

; Los workers heredan el entorno del contenedor (APP_KEY, DB_*, ...).
clear_env = no
chdir = /var/www/html

; Salida de los workers a los logs de Docker.
catch_workers_output = yes
decorate_workers_output = no

; Registro de acceso por stderr.
access.log = /proc/self/fd/2
access.format = "%R - %u %t \"%m %r\" %s %{mili}d %{kilo}M %C%%"

; Tiempos: las subidas de audio y la extracción de metadatos son lentas.
request_terminate_timeout = 660
request_slowlog_timeout = 15
slowlog = /proc/self/fd/2

; Errores de PHP a stderr.
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
