; Ajustes de producción (se cargan después de docker/php/php.ini).
; Objetivo: código inmutable (imagen) y máximo rendimiento por request.

; --- OPcache ---------------------------------------------------------------
; La imagen es inmutable: no hay código en caliente, así que no hace falta
; revalidar timestamps en cada request.
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.max_accelerated_files = 30000
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.save_comments = 1

; --- Caché de rutas reales --------------------------------------------------
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; --- Límites ---------------------------------------------------------------
memory_limit = 512M
max_execution_time = 600
max_input_time = 600

; --- Errores: a stderr (docker logs), nunca al cliente ----------------------
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
error_log = /proc/self/fd/2
