# Cabeceras de seguridad.
#
# En nginx, un `add_header` dentro de un bloque hijo descarta TODOS los
# `add_header` heredados del nivel superior. Por eso este snippet se incluye
# explícitamente en cada location que declare sus propias cabeceras.
#
# HSTS no se incluye aquí: lo añade el nginx del host, que es quien termina
# el TLS (enviarlo por HTTP no tiene efecto y confunde a las comprobaciones).

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
