server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 260m;

    # Seguridad básica
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compresión de respuestas de texto (el audio/imagen no se comprime).
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain
               application/xml image/svg+xml;

    # SPA / API: todo lo que no sea un fichero existente va a Laravel.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 600s;
        fastcgi_send_timeout 600s;
        fastcgi_buffering off;
    }

    # Archivos privados servidos por Nginx mediante X-Accel-Redirect.
    # Laravel responde con la cabecera X-Accel-Redirect y Nginx lee el fichero
    # directamente: soporta Range y no consume workers de PHP.
    location ^~ /_media/ {
        internal;
        alias /var/www/html/storage/app/private/media/;

        # Accept-Ranges, Cache-Control y X-Content-Type-Options ya vienen en la
        # respuesta de Laravel; duplicarlos aquí genera cabeceras repetidas.
        types {
            audio/mpeg  mp3;
            audio/flac  flac;
            audio/mp4   m4a mp4;
            audio/ogg   ogg opus;
            image/webp  webp;
            image/jpeg  jpg jpeg;
            image/png   png;
        }
        default_type application/octet-stream;
    }

    # Nunca exponer .env, .git, etc.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Assets con hash: caché agresiva.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
