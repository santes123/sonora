# Entorno de desarrollo canónico. Producción usa docker-compose.prod.yml (Fase 6).
name: music

x-app: &app
  image: music-app:dev
  env_file:
    - backend/.env
  volumes:
    - ./backend:/var/www/html
    # vendor en volumen Docker: evita la lentitud de miles de ficheros en NTFS.
    - backend_vendor:/var/www/html/vendor
  depends_on:
    mariadb:
      condition: service_healthy
    redis:
      condition: service_started
  restart: unless-stopped

services:
  app:
    <<: *app
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: music
      MARIADB_USER: music
      MARIADB_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/init.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Mismo comportamiento de FULLTEXT en desarrollo y producción.
      - --innodb-ft-min-token-size=3
      - --innodb-buffer-pool-size=512M
      - --slow-query-log=1
      - --long-query-time=0.5
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--queue=media,default", "--tries=3", "--timeout=300", "--max-time=3600"]
    depends_on:
      app:
        condition: service_started
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      disable: true

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_started
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      disable: true

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

  # Opcional: MinIO para probar el driver S3 sin cambiar la app.
  #   docker compose --profile s3 up -d minio
  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: music
      MINIO_ROOT_PASSWORD: music-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  mariadb_data:
  redis_data:
  backend_vendor:
  minio_data:
