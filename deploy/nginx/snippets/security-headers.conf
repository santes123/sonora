# Cabeceras de seguridad (nginx del host).
#
# En nginx, un `add_header` dentro de un bloque hijo descarta TODOS los
# `add_header` heredados del nivel superior. Por eso este snippet se incluye
# explícitamente en cada location que declare sus propias cabeceras.
#
#   sudo cp deploy/nginx/snippets/security-headers.conf /etc/nginx/snippets/
#
# HSTS: aquí sí, porque es el nginx del host quien termina el TLS.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
