# Parámetros FastCGI de Sonora (nginx del host).
#
#   sudo cp deploy/nginx/snippets/sonora-fastcgi.conf /etc/nginx/snippets/
#
# PHP-FPM habla FastCGI. Este snippet evita repetir los parámetros en cada
# location y fija las cabeceras de proxy que Laravel necesita para saber el
# esquema (https) y la IP real del cliente.

include /etc/nginx/fastcgi_params;

# Sin fastcgi_pass, nginx sirve el location como estático y la API devuelve
# 404 en vez de hablar con PHP.
fastcgi_pass 127.0.0.1:9000;

# Front controller de Laravel (ruta dentro del contenedor de la app).
fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
fastcgi_param SCRIPT_NAME /index.php;

# Cabeceras de proxy: sin esto Laravel creería que la petición viene de
# 127.0.0.1 en http plano, y el rate limit por IP trataría a todos los
# usuarios como el mismo.
fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
fastcgi_param HTTP_X_FORWARDED_HOST $host;
fastcgi_param HTTP_X_REAL_IP $remote_addr;
