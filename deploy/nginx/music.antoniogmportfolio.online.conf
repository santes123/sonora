# Configuración de nginx para el host de Ubuntu.
#
# Topología por defecto de Sonora:
#   Internet -> nginx del host (TLS, SPA estática) -> PHP-FPM (127.0.0.1:9000)
#            -> medios privados por X-Accel-Redirect (/srv/sonora/media)
#
# Instalación:
#   sudo cp deploy/nginx/music.antoniogmportfolio.online.conf \
#           /etc/nginx/sites-available/music.antoniogmportfolio.online
#   sudo ln -s /etc/nginx/sites-available/music.antoniogmportfolio.online \
#           /etc/nginx/sites-enabled/music.antoniogmportfolio.online
#   sudo nginx -t && sudo systemctl reload nginx
#
# Si el TLS lo termina el contenedor `web` (perfil nginx-docker), cambia
# `fastcgi_pass 127.0.0.1:9000;` por `fastcgi_pass app:9000;` y descomenta
# el bloque `location /` que hace de proxy al contenedor web.

# ---------------------------------------------------------------------------
# Redirección HTTP -> HTTPS (salvo el reto de ACME)
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name music.antoniogmportfolio.online;

    # Certbot renew: sirve el reto sin redirigir.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name music.antoniogmportfolio.online;

    # No anunciar la versión de nginx.
    server_tokens off;

    # Certificados gestionados por certbot (Let's Encrypt).
    ssl_certificate     /etc/letsencrypt/live/music.antoniogmportfolio.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/music.antoniogmportfolio.online/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # --- Cabeceras de seguridad ---------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # --- Límites ------------------------------------------------------------
    # Las subidas de audio llegan hasta 256 MB.
    client_max_body_size 260m;
    client_body_timeout 600s;
    keepalive_timeout 65s;
    send_timeout 600s;

    # --- Compresión ---------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain
               application/xml image/svg+xml application/manifest+json;

    # --- Raíz de la SPA -----------------------------------------------------
    # `dist` es la salida de `npm run build`; se copia desde la imagen web.
    root /srv/sonora/web;

    # --- Medios privados (X-Accel-Redirect) ---------------------------------
    # Laravel responde con la cabecera y nginx entrega el binario: soporta
    # Range y no consume workers de PHP. `internal` impide que se acceda
    # directamente por URL.
    location ^~ /_media/ {
        internal;
        alias /srv/sonora/media/;

        types {
            audio/mpeg  mp3;
            audio/flac  flac;
            audio/mp4   m4a mp4;
            audio/ogg   ogg opus;
            image/webp  webp;
            image/jpeg  jpg jpeg;
            image/png   png;
        }
        default_type application/octet-stream;
    }

    # --- API ----------------------------------------------------------------
    # PHP-FPM habla FastCGI (no HTTP): aquí va fastcgi_pass, no proxy_pass.
    location /api/ {
        include /etc/nginx/snippets/sonora-fastcgi.conf;

        # Subidas: sin buffering de la petición para no escribir el fichero
        # dos veces (una en el disco, otra al pasar por el proxy).
        fastcgi_request_buffering off;
        fastcgi_read_timeout 600s;
        fastcgi_send_timeout 600s;
    }

    # --- Sanctum (cookie CSRF de la SPA) -------------------------------------
    location /sanctum/ {
        include /etc/nginx/snippets/sonora-fastcgi.conf;
    }

    # --- Health check de Laravel --------------------------------------------
    location = /up {
        include /etc/nginx/snippets/sonora-fastcgi.conf;
        access_log off;
    }

    # --- index.html y service worker: nunca cacheados -----------------------
    # Son los que apuntan a los assets con hash: si se cachearan, un
    # despliegue nuevo no se vería hasta pasado un año.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    # --- Assets con hash: inmutables ----------------------------------------
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:woff2?|png|jpg|jpeg|webp|svg|ico)$ {
        add_header Cache-Control "public, max-age=604800" always;
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # --- SPA ----------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Registro ------------------------------------------------------------
    # Un log por request con el tiempo de la respuesta: base para detectar
    # cuellos de botella desde fuera.
    log_format sonora '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/music.antoniogmportfolio.online.access.log sonora;
    error_log  /var/log/nginx/music.antoniogmportfolio.online.error.log warn;
}
