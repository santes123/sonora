# Configuración de nginx para el host de Ubuntu (Sonora).
#
# Topología:
#   Internet -> nginx del host (TLS, SPA estática) -> PHP-FPM (127.0.0.1:9000)
#            -> medios privados por X-Accel-Redirect (/_media)
#
# Rutas del servidor:
#   Web root : /var/www/site-music-antoniogmport-5de994/htdocs
#   Logs    : /var/www/site-music-antoniogmport-5de994/logs
#   Medios  : /srv/sonora/media
#
# TLS: el certificado ya existe y se renueva solo (Let's Encrypt). Este
# archivo NO lanza certbot: solo usa el certificado que ya está en el disco.
#
# Instalación (lo hace deploy.sh):
#   sudo cp deploy/nginx/music.antoniogmportfolio.online.conf \
#           /etc/nginx/sites-available/music.antoniogmportfolio.online
#   sudo cp deploy/nginx/snippets/*.conf /etc/nginx/snippets/
#   sudo ln -s /etc/nginx/sites-available/music.antoniogmportfolio.online \
#           /etc/nginx/sites-enabled/music.antoniogmportfolio.online
#   sudo nginx -t && sudo systemctl reload nginx

# Formato de log: un registro por petición con el tiempo de respuesta, que
# es la base para detectar cuellos de botella desde fuera.
#
# `log_format` solo es válido en el contexto `http`: este archivo se incluye
# desde `sites-enabled/`, que está dentro de `http`, así que va aquí arriba y
# no dentro del bloque `server`.
log_format sonora '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" rt=$request_time urt=$upstream_response_time';

# ---------------------------------------------------------------------------
# Redirección HTTP -> HTTPS (salvo el reto de ACME)
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name music.antoniogmportfolio.online;

    # Renovación automática del certificado: el reto se sirve desde el
    # web root, sin redirigir.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/site-music-antoniogmport-5de994/htdocs;
        allow all;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    #__HTTP2__
    server_name music.antoniogmportfolio.online;

    # No anunciar la versión de nginx.
    server_tokens off;

    # Certificado ya emitido: se renueva solo, no hay que tocar certbot.
    ssl_certificate     /etc/letsencrypt/live/music.antoniogmportfolio.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/music.antoniogmportfolio.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # --- Logs ---------------------------------------------------------------
    access_log /var/www/site-music-antoniogmport-5de994/logs/access.log sonora;
    error_log  /var/www/site-music-antoniogmport-5de994/logs/error.log warn;

    # --- Raíz de la SPA -----------------------------------------------------
    root /var/www/site-music-antoniogmport-5de994/htdocs;
    index index.html index.htm;

    include /etc/nginx/snippets/security-headers.conf;

    # --- Límites ------------------------------------------------------------
    # Las subidas de audio llegan hasta 256 MB.
    client_max_body_size 260m;
    client_body_timeout 600s;
    keepalive_timeout 65s;
    send_timeout 600s;

    # --- Compresión ---------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain
               application/xml image/svg+xml application/manifest+json;

    # --- Medios privados (X-Accel-Redirect) ---------------------------------
    # Laravel responde con la cabecera y nginx entrega el binario: soporta
    # Range y no consume workers de PHP. `internal` impide que se acceda
    # directamente por URL.
    location ^~ /_media/ {
        internal;
        alias /srv/sonora/media/;

        types {
            audio/mpeg  mp3;
            audio/flac  flac;
            audio/mp4   m4a mp4;
            audio/ogg   ogg opus;
            image/webp  webp;
            image/jpeg  jpg jpeg;
            image/png   png;
        }
        default_type application/octet-stream;
    }

    # --- API ----------------------------------------------------------------
    # PHP-FPM habla FastCGI (no HTTP): aquí va fastcgi_pass, no proxy_pass.
    location /api/ {
        include /etc/nginx/snippets/sonora-fastcgi.conf;

        # Subidas: sin buffering de la petición para no escribir el fichero
        # dos veces (una en el disco, otra al pasar por el proxy).
        fastcgi_request_buffering off;
        fastcgi_read_timeout 600s;
        fastcgi_send_timeout 600s;
    }

    # --- Sanctum (cookie CSRF de la SPA) -------------------------------------
    location /sanctum/ {
        include /etc/nginx/snippets/sonora-fastcgi.conf;
    }

    # --- robots.txt ---------------------------------------------------------
    # Lo genera la aplicación: refleja el ajuste de indexación del panel de
    # administración (Disallow: / mientras el sitio sea privado).
    location = /robots.txt {
        include /etc/nginx/snippets/sonora-fastcgi.conf;
        access_log off;
    }

    # --- Health check de Laravel --------------------------------------------
    location = /up {
        include /etc/nginx/snippets/sonora-fastcgi.conf;
        access_log off;
    }

    # --- index.html y service worker: nunca cacheados -----------------------
    # Son los que apuntan a los assets con hash: si se cachearan, un
    # despliegue nuevo no se vería hasta pasado un año.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    # --- Assets con hash: inmutables ----------------------------------------
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:woff2?|png|jpg|jpeg|webp|svg|ico)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # --- SPA ----------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    #---BEGIN-ADMINER---
    # --- Adminer ------------------------------------------------------------
    # Aplanado: nginx no admite `location` anidados, así que cada tipo de
    # petición va en su propio bloque. Es la gestión de la base de datos:
    # déjalo solo si lo necesitas y recalls que es una puerta abierta.
    location /adminer {
        alias /usr/share/adminer/;
        index index.php index.html index.htm;
        try_files $uri $uri/ /adminer/index.php?$query_string;
    }

    location ~ ^/adminer/(.+\.php)$ {
        alias /usr/share/adminer/;

        include snippets/fastcgi-php.conf;
        fastcgi_param SCRIPT_FILENAME /usr/share/adminer/$1;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~* ^/adminer/.*\.(?:css|js|png|jpg|jpeg|gif|ico|svg)$ {
        alias /usr/share/adminer/;
        expires max;
        log_not_found off;
    }
    #---END-ADMINER---
}
